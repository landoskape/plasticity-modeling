[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasticity-modeling"
dynamic = ["version"]
description = "Code to generate and analyze plasticity models."
authors = [
    { name = "Andrew Landau" }
]
dependencies = [
    "numpy<2",
    # "numba", # need to install with conda at the moment
    "pandas",
    "scipy",
    "tqdm",
    "pyyaml",
    "pydantic",
    "freezedry",
    "matplotlib",
    "syd",
    "scikit-learn",
    "ipykernel",
    "optuna",
    "natsort",
]
requires-python = ">=3.9"

[project.optional-dependencies]
cpu = ["torch"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 120
