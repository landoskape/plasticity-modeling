site_name: Plasticity Modeling
site_url: https://landoskape.github.io/plasticity-modeling/
site_description: Computational neuroscience project modeling compartment-dependent synaptic plasticity
repo_url: https://github.com/landoskape/plasticity-modeling
repo_name: landoskape/plasticity-modeling

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Pipeline Overview: getting-started/pipeline.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Overview: concepts/index.md
      - Conductance Model: concepts/conductance-model.md
      - IAF Neuron & STDP: concepts/iaf-stdp.md
      - Correlated Inputs: concepts/correlated-inputs.md
      - Hofer Reconstruction: concepts/hofer-reconstruction.md
      - Experimental Data: concepts/experimental-data.md
  - API Reference:
      - Overview: api/index.md
      - Conductance: api/conductance.md
      - IAF:
          - Configuration: api/iaf/config.md
          - Simulation: api/iaf/simulation.md
          - Experiments: api/iaf/experiments.md
          - Neuron: api/iaf/neuron.md
          - Source Populations: api/iaf/source-population.md
          - Synapse Groups: api/iaf/synapse-group.md
          - Analysis: api/iaf/analysis.md
      - Utilities:
          - File Helpers: api/files.md
          - Plotting: api/plotting.md
          - Experimental Data: api/experimental.md
          - Schematics: api/schematics.md
